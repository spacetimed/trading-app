services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: trading_app
      POSTGRES_USER: trading_app
      POSTGRES_PASSWORD: trading_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
